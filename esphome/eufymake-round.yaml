font:
  - file: "gfonts://Noto Sans@700"
    id: small_font
    size: 14
    bpp: 4
    glyphsets: [GF_Latin_Kernel]
  - file: "gfonts://Noto Sans@700"
    id: status_font
    size: 31
    bpp: 4
    glyphsets: [GF_Latin_Kernel]
  - file: "gfonts://Noto Sans@700"
    id: dial_font
    size: 11
    bpp: 4
    glyphs: "0123456789% mL-eufykEaCMYKWG:AP"
  - file: "gfonts://Noto Sans@700"
    id: number_font
    size: 48
    bpp: 4
    glyphs: "0123456789% mL"
  - file: "gfonts://Noto Sans@700"
    id: arc_number_font
    size: 13
    bpp: 4
    glyphs: "0123456789% mL-eufykaE"
  - file: "gfonts://Noto Sans@700"
    id: expiry_font
    size: 23
    bpp: 4
    glyphs: "0123456789-"

globals:
  - id: unit_mode
    type: uint8_t
    initial_value: '0'
  - id: last_activity
    type: uint32_t
    initial_value: '0'
  - id: selected_metric
    type: int
    initial_value: '-1'
  - id: metric_selected_at
    type: uint32_t
    initial_value: '0'

i2c:
  sda: GPIO11
  scl: GPIO7
  scan: false

touchscreen:
  - platform: cst816
    display: round_display
    reset_pin: GPIO6
    on_touch:
      - lambda: |-
          const bool flipped = id(round_display).get_rotation() == display::DISPLAY_ROTATION_180_DEGREES;
          const int x = (flipped ? 239 - touch.x : touch.x) - 120;
          const int y = (flipped ? 239 - touch.y : touch.y) - 120;
          if (x*x + y*y < 65*65) {
            id(selected_metric) = -1;
          } else if (x*x + y*y >= 75*75 && x*x + y*y <= 113*113) {
            const float angle = fmodf(atan2f(x, -y) * 57.2957795f + 360.0f, 360.0f);
            const int metric = lroundf((angle - 48.0f) / 44.0f);
            if (metric >= 0 && metric < 7 && fabsf(angle - (48 + 44*metric)) <= 16) {
              id(selected_metric) = metric;
              id(metric_selected_at) = millis();
            }
          }
          id(last_activity) = millis();
          id(backlight).set_level(1.0f);
      - component.update: round_display

output:
  - platform: ledc
    id: backlight
    pin:
      number: GPIO42
      inverted: true

binary_sensor:
  - platform: gpio
    id: unit_button
    internal: true
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
      ignore_strapping_warning: true
    filters:
      - delayed_on_off: 30ms
    on_multi_click:
      - timing:
          - ON for at most 400ms
          - OFF for at least 350ms
        then:
          - lambda: |-
              id(unit_mode) = (id(unit_mode) + 1) % 4;
              id(last_activity) = millis();
              id(backlight).set_level(1.0f);
          - component.update: round_display
      - timing:
          - ON for at most 400ms
          - OFF for at most 349ms
          - ON for at most 400ms
          - OFF for at least 40ms
        then:
          - lambda: |-
              auto *screen = id(round_display);
              const bool flipped = screen->get_rotation() == display::DISPLAY_ROTATION_180_DEGREES;
              screen->set_rotation(flipped ? display::DISPLAY_ROTATION_0_DEGREES :
                                             display::DISPLAY_ROTATION_180_DEGREES);
              id(last_activity) = millis();
              id(backlight).set_level(1.0f);
          - component.update: round_display

# The Spotpear wiring matches the original firmware's serial diagnostics.
spi:
  clk_pin: GPIO4
  mosi_pin: GPIO2

display:
  - platform: mipi_spi
    id: round_display
    model: GC9A01A
    dimensions: 240x240
    cs_pin: GPIO5
    dc_pin: GPIO47
    reset_pin: GPIO38
    invert_colors: true
    color_order: bgr
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: false
    data_rate: 40MHz
    color_depth: 16
    buffer_size: 100%
    auto_clear_enabled: false
    update_interval: 1s
    lambda: !include round-dashboard.yaml
